<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gallery &mdash; JK Build Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; }
  a { color: oklch(50% 0.14 40); text-decoration: none; }
  a:hover { color: oklch(42% 0.14 40); }
  .h-serif { font-family: 'Newsreader', Georgia, serif; }
  .navlink { transition: color .15s ease; }
  .navlink:hover { color: oklch(93% 0.01 80) !important; }
  .tile { position:relative; overflow:hidden; border-radius: 8px; cursor:pointer; background: oklch(90% 0.005 75); aspect-ratio: 4/3; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition: transform .4s ease; }
  .tile:hover img { transform: scale(1.05); }
  #lightbox { position:fixed; inset:0; background: oklch(15% 0.008 75 / .92); z-index:100; display:none; align-items:center; justify-content:center; padding: 40px; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; display:block; }
  .lb-btn { position:absolute; background: oklch(15% 0.008 75 / .55); border:none; color: oklch(98% 0 0); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  #lb-close { top:24px; right:24px; width:44px; height:44px; }
  #lb-prev, #lb-next { top:50%; transform: translateY(-50%); width:52px; height:52px; }
  #lb-prev { left:16px; }
  #lb-next { right:16px; }
</style>
</head>
<body>

<div style="background: oklch(97% 0.006 80); color: oklch(18% 0.005 75); width: 100%;">

  <!-- NAV -->
  <div style="background: oklch(15% 0.008 75); position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding: 16px 64px;">
    <img src="Logo/logo-white-no-bg.png" alt="JK Build Solutions" style="height: 60px; width: auto;">
    <div style="display:flex; align-items:center; gap:26px;">
      <a class="navlink" href="index.html#services" style="color: oklch(80% 0.01 80); font-size: 14px; letter-spacing: .04em;">ABOUT</a>
      <a class="navlink" href="index.html#projects" style="color: oklch(80% 0.01 80); font-size: 14px; letter-spacing: .04em;">PROJECTS</a>
      <span style="color: oklch(62% 0.15 40); font-size: 14px; letter-spacing: .04em; border-bottom: 1px solid oklch(62% 0.15 40); padding-bottom: 2px;">GALLERY</span>
      <a class="navlink" href="index.html#contact" style="color: oklch(80% 0.01 80); font-size: 14px; letter-spacing: .04em;">CONTACT</a>
    </div>
    <a href="tel:0451674855" style="display:flex; align-items:center; gap:8px; color: oklch(93% 0.01 80); font-size: 14px; font-weight: 600; border: 1px solid oklch(35% 0.01 75); padding: 10px 18px; border-radius: 2px;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.4 21 3 12.6 3 3c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg>
      04 516 74 855
    </a>
  </div>

  <!-- PAGE HEADER -->
  <div style="padding: 80px 64px 56px; max-width: 1280px; margin: 0 auto;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom: 18px;">
      <span style="width:28px; height:1px; background: oklch(50% 0.14 40);"></span>
      <span style="font-size: 13px; letter-spacing: .12em; color: oklch(50% 0.005 75);">SCENIC RIM &amp; GOLD COAST</span>
    </div>
    <h1 class="h-serif" style="font-size: 44px; font-weight: 500; font-style: italic; margin: 0 0 14px;">Gallery</h1>
    <p style="font-size: 16px; line-height: 1.6; color: oklch(45% 0.005 75); max-width: 560px; margin: 0;">A closer look at our work. Tap a photo to view it larger.</p>
  </div>

  <!-- GRID -->
  <div style="padding: 0 64px 96px; max-width: 1280px; margin: 0 auto;">
    <div id="gallery-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;"></div>
  </div>

  <!-- FOOTER -->
  <div style="background: oklch(15% 0.008 75); padding: 32px 64px; display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 12px;">
    <img src="Logo/logo-white-no-bg.png" alt="JK Build Solutions" style="height: 22px; width: auto; opacity: .7;">
    <p style="font-size: 13px; color: oklch(58% 0.01 75); margin:0;">&copy; 2026 JK Build Solutions &middot; QBCC 15475385 &middot; Scenic Rim &amp; Gold Coast</p>
  </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lb-close" class="lb-btn" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>
  </button>
  <button id="lb-prev" class="lb-btn" aria-label="Previous">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next" class="lb-btn" aria-label="Next">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<script>
  let photos = [];
  let current = 0;

  function openLightbox(i) {
    current = i;
    document.getElementById('lb-img').src = photos[current].src;
    document.getElementById('lb-img').alt = photos[current].alt || '';
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }
  function step(delta) {
    current = (current + delta + photos.length) % photos.length;
    document.getElementById('lb-img').src = photos[current].src;
    document.getElementById('lb-img').alt = photos[current].alt || '';
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', () => step(-1));
  document.getElementById('lb-next').addEventListener('click', () => step(1));
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  fetch('data/gallery.json')
    .then((r) => r.json())
    .then((data) => {
      photos = data;
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = photos
        .map(
          (p, i) =>
            `<div class="tile" data-index="${i}"><img src="${p.src}" alt="${(p.alt || '').replace(/"/g, '&quot;')}" loading="lazy"></div>`
        )
        .join('');
      grid.querySelectorAll('.tile').forEach((tile) => {
        tile.addEventListener('click', () => openLightbox(Number(tile.dataset.index)));
      });
    })
    .catch(() => {});
</script>
</body>
</html>

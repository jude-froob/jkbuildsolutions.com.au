<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Manage Photos &mdash; JK Build Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; }
  a { color: oklch(50% 0.14 40); text-decoration: none; }
  a:hover { color: oklch(42% 0.14 40); }
  .h-serif { font-family: 'Newsreader', Georgia, serif; }
  .navlink { transition: color .15s ease; }
  .navlink:hover { color: oklch(93% 0.01 80) !important; }

  label { display: block; font-size: 13px; letter-spacing: .04em; color: oklch(40% 0.005 75); margin-bottom: 6px; }
  .field { margin-bottom: 20px; }
  input[type="text"], input[type="password"] {
    width: 100%; font: inherit; font-size: 15px; padding: 10px 12px;
    border: 1px solid oklch(85% 0.005 75); border-radius: 4px;
    background: oklch(99% 0.002 80); color: oklch(18% 0.005 75);
  }
  input[type="text"]:focus, input[type="password"]:focus {
    outline: 2px solid oklch(50% 0.14 40 / 40%); outline-offset: 1px;
  }

  .tabs { display:flex; gap: 4px; margin-bottom: 32px; border-bottom: 1px solid oklch(85% 0.005 75); }
  .tab-btn {
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: .02em; color: oklch(45% 0.005 75);
    background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 4px; margin-right: 28px;
    cursor: pointer;
  }
  .tab-btn.active { color: oklch(50% 0.14 40); border-bottom-color: oklch(50% 0.14 40); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  #gallery-previews { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
  #gallery-previews .thumb { width: 140px; }
  #gallery-previews .thumb img { width: 140px; height: 105px; object-fit: cover; border-radius: 4px; display:block; background: oklch(90% 0.005 75); }
  #gallery-previews .thumb.error { display:flex; align-items:center; justify-content:center; width:140px; height:105px; font-size: 11px; text-align:center; padding: 6px; color: oklch(45% 0.14 30); border-radius: 4px; background: oklch(96% 0.02 30); }
  #gallery-previews .thumb input[type="text"] { margin-top: 6px; font-size: 12px; padding: 6px 8px; }

  .slot-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 28px; }
  .slot-card { border: 1px solid oklch(85% 0.005 75); border-radius: 6px; padding: 18px; background: oklch(99% 0.002 80); }
  .slot-card h4 { margin: 0 0 12px; font-size: 13px; letter-spacing: .06em; color: oklch(45% 0.005 75); }
  .slot-thumb { width: 100%; height: 140px; border-radius: 4px; overflow:hidden; background: oklch(90% 0.005 75); margin-bottom: 12px; display:flex; align-items:center; justify-content:center; }
  .slot-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .slot-thumb.empty span { font-size: 12px; color: oklch(55% 0.005 75); }
  .slot-card.deleted { opacity: .45; }
  .slot-actions { display:flex; align-items:center; gap: 8px; margin-top: 10px; font-size: 13px; }
  .slot-actions label { display:flex; align-items:center; gap:6px; font-size: 13px; color: oklch(35% 0.005 75); margin: 0; }

  .submit-btn {
    display: inline-flex; align-items: center; gap: 10px; background: oklch(50% 0.14 40);
    color: oklch(98% 0 0); font-weight: 600; font-size: 15px; padding: 14px 28px;
    border: none; border-radius: 3px; cursor: pointer;
  }
  .submit-btn:disabled { opacity: .55; cursor: not-allowed; }
  .status-msg { margin-top: 16px; font-size: 14px; }
  .status-msg.error { color: oklch(45% 0.18 30); }
  .status-msg.success { color: oklch(40% 0.12 150); }
</style>
</head>
<body>

<div style="background: oklch(97% 0.006 80); color: oklch(18% 0.005 75); width: 100%; min-height: 100vh;">

  <!-- NAV -->
  <div style="background: oklch(15% 0.008 75); display:flex; align-items:center; justify-content:space-between; padding: 16px 64px;">
    <img src="Logo/logo-white-no-bg.png" alt="JK Build Solutions" style="height: 60px; width: auto;">
    <div style="display:flex; align-items:center; gap:26px;">
      <a class="navlink" href="index.html#services" style="color: oklch(80% 0.01 80); font-size: 14px; letter-spacing: .04em;">SERVICES</a>
      <a class="navlink" href="gallery.html" style="color: oklch(80% 0.01 80); font-size: 14px; letter-spacing: .04em;">GALLERY</a>
      <a class="navlink" href="index.html#contact" style="color: oklch(80% 0.01 80); font-size: 14px; letter-spacing: .04em;">CONTACT</a>
    </div>
  </div>

  <!-- PAGE HEADER -->
  <div style="padding: 56px 64px 0; max-width: 880px; margin: 0 auto;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom: 18px;">
      <span style="width:28px; height:1px; background: oklch(50% 0.14 40);"></span>
      <span style="font-size: 13px; letter-spacing: .12em; color: oklch(50% 0.005 75);">INTERNAL USE</span>
    </div>
    <h1 class="h-serif" style="font-size: 38px; font-weight: 500; font-style: italic; margin: 0 0 12px;">Manage Photos</h1>
    <p style="font-size: 15px; line-height: 1.6; color: oklch(45% 0.005 75); margin:0 0 32px;">Add photos to the gallery, or replace the homepage's Recent Projects photos.</p>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="gallery-tab">Add to gallery</button>
      <button type="button" class="tab-btn" data-tab="recent-tab">Recent projects</button>
    </div>
  </div>

  <!-- GALLERY TAB -->
  <div style="padding: 0 64px 72px; max-width: 880px; margin: 0 auto;">
    <div id="gallery-tab" class="tab-panel active">
      <form id="gallery-form">
        <div class="field">
          <label for="gallery-passphrase">Access passphrase</label>
          <input type="password" id="gallery-passphrase" name="passphrase" required autocomplete="off">
        </div>
        <div class="field">
          <label for="gallery-photos-input">Photos to add</label>
          <input type="file" id="gallery-photos-input" accept="image/*" multiple required>
          <div id="gallery-previews"></div>
        </div>
        <button type="submit" class="submit-btn" id="gallery-submit-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
          Add to gallery
        </button>
        <div id="gallery-status" class="status-msg"></div>
      </form>
    </div>

    <!-- RECENT PROJECTS TAB -->
    <div id="recent-tab" class="tab-panel">
      <p style="font-size: 13px; color: oklch(45% 0.005 75); margin: 0 0 20px;">Exactly 4 photos show on the homepage. Replace a photo, edit its caption, or delete it (the slot stays empty until you upload a new photo).</p>
      <form id="recent-form">
        <div class="field">
          <label for="recent-passphrase">Access passphrase</label>
          <input type="password" id="recent-passphrase" name="passphrase" required autocomplete="off">
        </div>
        <div id="recent-slots" class="slot-grid">Loading current photos&hellip;</div>
        <button type="submit" class="submit-btn" id="recent-submit-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
          Save recent projects
        </button>
        <div id="recent-status" class="status-msg"></div>
      </form>
    </div>
  </div>

</div>

<script>
  const WORKER_URL = 'https://jk-new-pdf-project-form.judith-kelmanson.workers.dev/';
  const MAX_WIDTH = 1600;
  const JPEG_QUALITY = 0.8;
  const MAX_GALLERY_PHOTOS = 10;
  const RECENT_SLOT_COUNT = 4;

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  async function resizeImage(file, maxWidth = MAX_WIDTH, quality = JPEG_QUALITY) {
    const img = document.createElement('img');
    const url = URL.createObjectURL(file);
    try {
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error(`Could not read "${file.name}" as an image`));
        img.src = url;
      });
      const scale = Math.min(1, maxWidth / img.naturalWidth);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
      if (!blob) throw new Error(`Could not re-encode "${file.name}"`);
      return new File([blob], 'photo.jpg', { type: 'image/jpeg' });
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  // ---------- Gallery tab ----------

  const galleryForm = document.getElementById('gallery-form');
  const galleryPhotosInput = document.getElementById('gallery-photos-input');
  const galleryPreviews = document.getElementById('gallery-previews');
  const galleryStatus = document.getElementById('gallery-status');
  const gallerySubmitBtn = document.getElementById('gallery-submit-btn');

  let galleryResized = []; // [{file, altInput}]

  galleryPhotosInput.addEventListener('change', async () => {
    galleryPreviews.innerHTML = '';
    galleryResized = [];

    const files = Array.from(galleryPhotosInput.files).slice(0, MAX_GALLERY_PHOTOS);
    if (galleryPhotosInput.files.length > MAX_GALLERY_PHOTOS) {
      galleryStatus.textContent = `Only the first ${MAX_GALLERY_PHOTOS} photos will be used.`;
      galleryStatus.className = 'status-msg error';
    } else {
      galleryStatus.textContent = '';
      galleryStatus.className = 'status-msg';
    }

    for (const file of files) {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      galleryPreviews.appendChild(thumb);
      try {
        const resized = await resizeImage(file);
        const img = document.createElement('img');
        img.src = URL.createObjectURL(resized);
        const altInput = document.createElement('input');
        altInput.type = 'text';
        altInput.placeholder = 'Photo description (optional)';
        thumb.appendChild(img);
        thumb.appendChild(altInput);
        galleryResized.push({ file: resized, altInput });
      } catch (err) {
        thumb.classList.add('error');
        thumb.textContent = err.message;
      }
    }
  });

  galleryForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    galleryStatus.textContent = '';
    galleryStatus.className = 'status-msg';

    if (galleryResized.length === 0) {
      galleryStatus.textContent = 'Please choose at least one photo that loaded successfully above.';
      galleryStatus.className = 'status-msg error';
      return;
    }

    gallerySubmitBtn.disabled = true;
    galleryStatus.textContent = 'Uploading…';

    try {
      const fd = new FormData();
      fd.append('action', 'gallery-add');
      fd.append('passphrase', document.getElementById('gallery-passphrase').value);
      galleryResized.forEach(({ file, altInput }) => {
        fd.append('photos', file);
        fd.append('alts', altInput.value.trim());
      });

      const res = await fetch(WORKER_URL, { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `Upload failed (${res.status})`);

      galleryStatus.textContent = `Added ${galleryResized.length} photo(s) to the gallery. The site will update in a minute or two.`;
      galleryStatus.className = 'status-msg success';
      galleryForm.reset();
      galleryPreviews.innerHTML = '';
      galleryResized = [];
    } catch (err) {
      galleryStatus.textContent = err.message;
      galleryStatus.className = 'status-msg error';
    } finally {
      gallerySubmitBtn.disabled = false;
    }
  });

  // ---------- Recent projects tab ----------

  const recentForm = document.getElementById('recent-form');
  const recentSlotsEl = document.getElementById('recent-slots');
  const recentStatus = document.getElementById('recent-status');
  const recentSubmitBtn = document.getElementById('recent-submit-btn');

  let recentSlotsData = []; // current [{src, alt, caption} | null]

  function renderSlots() {
    recentSlotsEl.innerHTML = '';
    for (let i = 0; i < RECENT_SLOT_COUNT; i++) {
      const current = recentSlotsData[i] || null;
      const card = document.createElement('div');
      card.className = 'slot-card';
      card.dataset.index = String(i);

      card.innerHTML = `
        <h4>SLOT ${i + 1}</h4>
        <div class="slot-thumb ${current ? '' : 'empty'}">
          ${current ? `<img src="${current.src}" alt="">` : '<span>No photo</span>'}
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label>Caption</label>
          <input type="text" class="slot-caption" value="${current ? (current.caption || '').replace(/"/g, '&quot;') : ''}" placeholder="Shown on hover">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Replace photo</label>
          <input type="file" class="slot-file" accept="image/*">
        </div>
        <div class="slot-actions">
          <label><input type="checkbox" class="slot-delete"> Delete this photo</label>
        </div>
      `;
      recentSlotsEl.appendChild(card);

      const fileInput = card.querySelector('.slot-file');
      const deleteCheckbox = card.querySelector('.slot-delete');
      const thumbEl = card.querySelector('.slot-thumb');

      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;
        deleteCheckbox.checked = false;
        card.classList.remove('deleted');
        try {
          const resized = await resizeImage(file);
          fileInput._resizedFile = resized;
          thumbEl.classList.remove('empty');
          thumbEl.innerHTML = `<img src="${URL.createObjectURL(resized)}" alt="">`;
        } catch (err) {
          recentStatus.textContent = err.message;
          recentStatus.className = 'status-msg error';
        }
      });

      deleteCheckbox.addEventListener('change', () => {
        card.classList.toggle('deleted', deleteCheckbox.checked);
        if (deleteCheckbox.checked) {
          fileInput.value = '';
          fileInput._resizedFile = null;
          thumbEl.classList.add('empty');
          thumbEl.innerHTML = '<span>No photo</span>';
        } else if (current) {
          thumbEl.classList.remove('empty');
          thumbEl.innerHTML = `<img src="${current.src}" alt="">`;
        }
      });
    }
  }

  fetch('data/recent-projects.json')
    .then((r) => r.json())
    .then((slots) => {
      recentSlotsData = slots;
      renderSlots();
    })
    .catch(() => {
      recentSlotsEl.textContent = 'Could not load the current recent-projects photos. You can still submit changes below.';
      recentSlotsData = new Array(RECENT_SLOT_COUNT).fill(null);
      renderSlots();
    });

  recentForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    recentStatus.textContent = '';
    recentStatus.className = 'status-msg';
    recentSubmitBtn.disabled = true;
    recentStatus.textContent = 'Saving…';

    try {
      const fd = new FormData();
      fd.append('action', 'recent-update');
      fd.append('passphrase', document.getElementById('recent-passphrase').value);

      const cards = recentSlotsEl.querySelectorAll('.slot-card');
      cards.forEach((card) => {
        const i = card.dataset.index;
        const caption = card.querySelector('.slot-caption').value.trim();
        const deleted = card.querySelector('.slot-delete').checked;
        const fileInput = card.querySelector('.slot-file');
        const resizedFile = fileInput._resizedFile;

        fd.append(`slot-${i}-caption`, caption);
        fd.append(`slot-${i}-delete`, deleted ? 'true' : 'false');
        if (resizedFile) fd.append(`slot-${i}-photo`, resizedFile);
      });

      const res = await fetch(WORKER_URL, { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `Save failed (${res.status})`);

      recentStatus.textContent = 'Saved. The homepage will update in a minute or two.';
      recentStatus.className = 'status-msg success';
      recentSlotsData = data.slots || recentSlotsData;
      renderSlots();
      document.getElementById('recent-passphrase').value = '';
    } catch (err) {
      recentStatus.textContent = err.message;
      recentStatus.className = 'status-msg error';
    } finally {
      recentSubmitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
